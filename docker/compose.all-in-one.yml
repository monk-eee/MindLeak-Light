services:
  mindleak-light:
    image: ${MINDLEAK_IMAGE:-monkeemagic/mindleak-light:0.6.0}
    environment:
      MINDLEAK_HTTP_TOKEN: ${MINDLEAK_HTTP_TOKEN:?Set a strong MINDLEAK_HTTP_TOKEN}
      POSTGRES_DB: ${POSTGRES_DB:-mindleak_light}
      MINDLEAK_MIGRATION_BATCH_SIZE: ${MINDLEAK_MIGRATION_BATCH_SIZE:-1024}
      MINDLEAK_MIGRATION_STATEMENT_TIMEOUT_SECS: ${MINDLEAK_MIGRATION_STATEMENT_TIMEOUT_SECS:-30}
      MINDLEAK_MIGRATION_DDL_TIMEOUT_SECS: ${MINDLEAK_MIGRATION_DDL_TIMEOUT_SECS:-900}
      MINDLEAK_MIGRATION_CANARIES: ${MINDLEAK_MIGRATION_CANARIES:-}
      MINDLEAK_DECOMPOSITION: ${MINDLEAK_DECOMPOSITION:-sentences}
      MINDLEAK_FORMATION: ${MINDLEAK_FORMATION:-off}
      MINDLEAK_RETRIEVAL: ${MINDLEAK_RETRIEVAL:-keyword}
      MINDLEAK_RECALL_MIN_SIMILARITY: ${MINDLEAK_RECALL_MIN_SIMILARITY:--1}
      MINDLEAK_LLM_URL: ${MINDLEAK_LLM_URL:-}
      MINDLEAK_MODEL: ${MINDLEAK_MODEL:-}
      MINDLEAK_LLM_API_KEY: ${MINDLEAK_LLM_API_KEY:-}
      MINDLEAK_LLM_REASONING_EFFORT: ${MINDLEAK_LLM_REASONING_EFFORT:-}
      MINDLEAK_EMBED_URL: ${MINDLEAK_EMBED_URL:-}
      MINDLEAK_EMBED_MODEL: ${MINDLEAK_EMBED_MODEL:-}
      MINDLEAK_EMBED_API_KEY: ${MINDLEAK_EMBED_API_KEY:-}
      MINDLEAK_EMBED_DIMENSIONS: ${MINDLEAK_EMBED_DIMENSIONS:-}
      MINDLEAK_RELEVANCE: ${MINDLEAK_RELEVANCE:-off}
      MINDLEAK_RELEVANCE_URL: ${MINDLEAK_RELEVANCE_URL:-}
      MINDLEAK_RELEVANCE_MODEL: ${MINDLEAK_RELEVANCE_MODEL:-}
      MINDLEAK_RELEVANCE_API_KEY: ${MINDLEAK_RELEVANCE_API_KEY:-}
      MINDLEAK_RELEVANCE_CANDIDATES: ${MINDLEAK_RELEVANCE_CANDIDATES:-20}
      MINDLEAK_RELEVANCE_REASONING_EFFORT: ${MINDLEAK_RELEVANCE_REASONING_EFFORT:-}
      MINDLEAK_MODEL_TIMEOUT_SECS: ${MINDLEAK_MODEL_TIMEOUT_SECS:-60}
    ports:
      - "127.0.0.1:${MINDLEAK_HTTP_PORT:-8088}:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 3 -H \"Authorization: Bearer $$MINDLEAK_HTTP_TOKEN\" http://127.0.0.1:8088/health"]
      interval: 5s
      timeout: 4s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 60s

volumes:
  data:
