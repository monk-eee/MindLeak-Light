[supervisord]
nodaemon=true
user=root
loglevel=warn
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/mindleak-supervisord.pid

[program:postgres]
command=/usr/local/bin/docker-entrypoint.sh postgres -c listen_addresses= -c unix_socket_directories=/var/run/postgresql -c log_statement=none -c log_min_error_statement=panic -c log_error_verbosity=terse -c log_parameter_max_length_on_error=0
priority=10
autostart=true
autorestart=unexpected
startsecs=1
startretries=10
stopsignal=INT
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:mcp]
command=/usr/local/bin/mindleak-light --transport http --listen 0.0.0.0:8088
user=mindleak
directory=/opt/mindleak
priority=20
autostart=true
autorestart=unexpected
startsecs=1
startretries=30
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
