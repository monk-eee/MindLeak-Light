[workspace]
resolver = "2"
members = [
	"crates/mindleak-memory",
	"crates/mindleak-provider",
	"crates/mindleak-decomposition",
	"crates/mindleak-embeddings",
	"crates/mindleak-storage-postgres",
	"crates/mindleak-mcp",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
deadpool-postgres = "0.14"
dotenvy = "0.15"
pgvector = { version = "0.4", features = ["postgres"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.4", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = "0.7"
tower-http = { version = "0.7", features = ["limit", "timeout"] }
uuid = { version = "1", features = ["v4", "serde"] }
unicode-segmentation = "1.12"
webpki-roots = "1"
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
