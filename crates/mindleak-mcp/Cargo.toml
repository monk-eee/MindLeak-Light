[package]
name = "mindleak-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "mindleak-light"
path = "src/main.rs"

[dependencies]
mindleak-memory = { path = "../mindleak-memory" }
mindleak-decomposition = { path = "../mindleak-decomposition" }
mindleak-embeddings = { path = "../mindleak-embeddings" }
mindleak-storage-postgres = { path = "../mindleak-storage-postgres" }
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
dotenvy.workspace = true
jsonc-parser = { version = "0.33", features = ["serde", "cst"] }
reqwest.workspace = true
reqwest-mcp = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
fs2 = "0.4"
quick-xml = "0.42"
tar = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
tracing.workspace = true
tracing-subscriber.workspace = true
subtle.workspace = true
toml = "1.1"
tokio = { workspace = true, features = ["process", "fs", "io-util"] }
tokio-util.workspace = true
tower-http.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
dunce = "1"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_SystemServices"] }

[dev-dependencies]
async-trait.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
tokio.workspace = true
tokio-postgres.workspace = true
wiremock.workspace = true

[features]
postgres-tests = []

[[test]]
name = "mcp"
path = "../../tests/mcp.rs"
required-features = ["postgres-tests"]

[[test]]
name = "backup"
path = "../../tests/backup.rs"
