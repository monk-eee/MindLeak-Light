[package]
name = "mindleak-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "mindleak-light"
path = "src/main.rs"

[dependencies]
mindleak-memory = { path = "../mindleak-memory" }
mindleak-decomposition = { path = "../mindleak-decomposition" }
mindleak-embeddings = { path = "../mindleak-embeddings" }
mindleak-storage-postgres = { path = "../mindleak-storage-postgres" }
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
dotenvy.workspace = true
jsonc-parser = { version = "0.26", features = ["serde"] }
reqwest.workspace = true
reqwest-mcp = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tracing.workspace = true
tracing-subscriber.workspace = true
subtle.workspace = true
tempfile = "3"
toml = "0.8"
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
tower-http.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
tokio.workspace = true
tokio-postgres.workspace = true
wiremock.workspace = true

[features]
postgres-tests = []

[[test]]
name = "mcp"
path = "../../tests/mcp.rs"
required-features = ["postgres-tests"]
