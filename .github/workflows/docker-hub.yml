name: Publish Docker Hub Image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish; defaults to the selected workflow ref
        type: string
        required: false
      publish_latest:
        description: Also update latest (stable release tags only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-hub-publish
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate Release and Registry Setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      release_tag: ${{ steps.source.outputs.tag }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Require an explicit release tag and configured token
        env:
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Select an existing release tag or supply release_tag=vX.Y.Z."
            exit 1
          fi
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Configure the DOCKERHUB_TOKEN repository secret first."
            exit 1
          fi
          if [[ "$PUBLISH_LATEST" == true && "$RELEASE_TAG" == *-* ]]; then
            echo "::error::A prerelease cannot update latest."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/release.mjs --check "$RELEASE_TAG"
      - id: source
        name: Pin the validated release source
        run: |
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  verify:
    needs: metadata
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.metadata.outputs.source_sha }}

  build:
    name: Build and Test (${{ matrix.arch }})
    needs: [metadata, verify]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'monkeemagic' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: monkeemagic/mindleak-light
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.metadata.outputs.release_tag }}
          labels: |
            org.opencontainers.image.title=MindLeak Light
            org.opencontainers.image.description=Shared agent memory with MCP and PostgreSQL in one container
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ needs.metadata.outputs.source_sha }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: all-in-one
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=monkeemagic/mindleak-light,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=mindleak-${{ matrix.arch }}
          cache-to: type=gha,scope=mindleak-${{ matrix.arch }},mode=max
          provenance: mode=max
          sbom: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --prefix examples --ignore-scripts
      - name: Verify the pushed image on its native architecture
        env:
          MINDLEAK_IMAGE: monkeemagic/mindleak-light@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$MINDLEAK_IMAGE"
          node scripts/container-smoke.mjs
      - name: Export the tested digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Build did not return a valid image digest."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: image-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Tested Multi-Architecture Tag
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: image-digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'monkeemagic' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish only the two verified platform digests
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          image=monkeemagic/mindleak-light
          digest_files=("$DIGEST_DIR"/*)
          if [[ "${#digest_files[@]}" -ne 2 ]]; then
            echo "::error::Expected exactly two tested platform digests."
            exit 1
          fi
          references=()
          for file in "${digest_files[@]}"; do
            digest="${file##*/}"
            if [[ ! "$digest" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::Invalid digest artifact."
              exit 1
            fi
            references+=("$image@sha256:$digest")
          done
          tags=(--tag "$image:${RELEASE_TAG#v}")
          if [[ "$PUBLISH_LATEST" == true ]]; then
            tags+=(--tag "$image:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${references[@]}"
          docker buildx imagetools inspect --raw "$image:${RELEASE_TAG#v}" |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
