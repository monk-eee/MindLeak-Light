name: Publish Docker Hub Image

on:
  workflow_dispatch:
    inputs:
      publish_latest:
        description: Also update latest (stable release tags only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-hub-publish
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate Release and Registry Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require an explicit release tag and configured token
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ "$RELEASE_REF" != refs/tags/v* ]]; then
            echo "::error::Run this workflow from a release tag, not a branch."
            exit 1
          fi
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Configure the DOCKERHUB_TOKEN repository secret first."
            exit 1
          fi
          if [[ "$PUBLISH_LATEST" == true && "$RELEASE_TAG" == *-* ]]; then
            echo "::error::A prerelease cannot update latest."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/release.mjs --check "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  verify:
    needs: metadata
    uses: ./.github/workflows/ci.yml

  image:
    name: Publish monkeemagic/mindleak-light
    needs: [metadata, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'monkeemagic' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: monkeemagic/mindleak-light
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ inputs.publish_latest }}
          labels: |
            org.opencontainers.image.title=MindLeak Light
            org.opencontainers.image.description=Shared agent memory with MCP and PostgreSQL in one container
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: all-in-one
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
