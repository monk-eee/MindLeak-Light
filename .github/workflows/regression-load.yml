name: Release Regression Load Report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: First and Repeat Recall Under Load
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: mindleak_light
          POSTGRES_PASSWORD: mindleak-light-test-only
          POSTGRES_DB: mindleak_load_admin_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U mindleak_light -d mindleak_load_admin_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      MINDLEAK_BASELINE_DATABASE_URL: postgresql://mindleak_light:mindleak-light-test-only@127.0.0.1:5432/mindleak_baseline_load_test?sslmode=disable
      MINDLEAK_TEST_DATABASE_URL: postgresql://mindleak_light:mindleak-light-test-only@127.0.0.1:5432/mindleak_candidate_load_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --prefix examples --ignore-scripts
      - run: cargo build --release --locked -p mindleak-mcp --bin mindleak-light
      - name: Compare first and repeat passes at concurrency one and four
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U mindleak_light mindleak_baseline_load_test
          docker exec "$POSTGRES_CONTAINER" createdb -U mindleak_light mindleak_candidate_load_test
          node scripts/regression-check.mjs --candidate target/release/mindleak-light --profile load --output target/regression-load
      - name: Preserve load reports even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-regression-load-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/regression-load/
          retention-days: 30
          if-no-files-found: warn
