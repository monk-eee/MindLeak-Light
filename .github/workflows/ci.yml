name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable source commit to validate for a release
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: node scripts/check-repo.mjs

  postgres:
    name: Postgres and MCP Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: mindleak_light
          POSTGRES_PASSWORD: mindleak-light-test-only
          POSTGRES_DB: mindleak_light_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U mindleak_light -d mindleak_light_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      MINDLEAK_TEST_DATABASE_URL: postgresql://mindleak_light:mindleak-light-test-only@127.0.0.1:5432/mindleak_light_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked
      - name: Install pinned restic for backup integration
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/restic-bin"
          curl --fail --silent --show-error --location https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2 -o "$RUNNER_TEMP/restic.bz2"
          printf 'f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c  %s\n' "$RUNNER_TEMP/restic.bz2" | sha256sum --check -
          bzip2 --decompress --stdout "$RUNNER_TEMP/restic.bz2" > "$RUNNER_TEMP/restic-bin/restic"
          chmod 700 "$RUNNER_TEMP/restic-bin/restic"
          echo "$RUNNER_TEMP/restic-bin" >> "$GITHUB_PATH"
      - name: Encrypted backup and coherent restore
        timeout-minutes: 10
        env:
          MINDLEAK_BACKUP_TEST_CONTAINER: ${{ job.services.postgres.id }}
          MINDLEAK_BACKUP_CONTAINER_TOOL: docker
        run: make backup-test
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --prefix examples --ignore-scripts
      - run: cargo build --release --locked -p mindleak-mcp --bin mindleak-light
      - name: Verify domain imports through real MCP
        timeout-minutes: 3
        env:
          MINDLEAK_DOMAIN_TEST_BINARY: ${{ github.workspace }}/target/release/mindleak-light
        run: node --test --test-name-pattern='domain importer' scripts/repository.test.mjs
      - name: Compare with the pinned released baseline
        timeout-minutes: 12
        env:
          REGRESSION_OUTPUT: ${{ runner.temp }}/mindleak-regression-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          MINDLEAK_BASELINE_DATABASE_URL: postgresql://mindleak_light:mindleak-light-test-only@127.0.0.1:5432/mindleak_baseline_regression_test?sslmode=disable
          MINDLEAK_TEST_DATABASE_URL: postgresql://mindleak_light:mindleak-light-test-only@127.0.0.1:5432/mindleak_candidate_regression_test?sslmode=disable
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U mindleak_light mindleak_baseline_regression_test
          docker exec "$POSTGRES_CONTAINER" createdb -U mindleak_light mindleak_candidate_regression_test
          node scripts/regression-check.mjs --candidate target/release/mindleak-light --output "$REGRESSION_OUTPUT" --deadline-seconds 600
      - name: Preserve release comparison evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mindleak-regression-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 30
          if-no-files-found: warn

  hygiene:
    name: Repository Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  container:
    name: Two-Service Compose Startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 120
      - run: docker compose exec -T mcp mindleak-light --version
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  all-in-one:
    name: All-in-One Container Persistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --prefix examples --ignore-scripts
      - run: docker build --target all-in-one -f docker/Dockerfile -t mindleak-light:all-in-one-test .
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p mindleak-mcp --bin mindleak-light
      - name: Credential-free local onboarding
        timeout-minutes: 10
        env:
          MINDLEAK_IMAGE: mindleak-light:all-in-one-test
        run: node scripts/local-access-smoke.mjs
      - name: Upgrade from published 0.1.0
        run: node scripts/container-smoke.mjs
        env:
          MINDLEAK_IMAGE: mindleak-light:all-in-one-test
          MINDLEAK_UPGRADE_FROM: monkeemagic/mindleak-light@sha256:9ac382f5ac6db6c43341fa5dac42581b077a95848885aa80c4a8b6fc0815e7a8
      - name: Upgrade from published 0.2.0
        run: node scripts/container-smoke.mjs
        env:
          MINDLEAK_IMAGE: mindleak-light:all-in-one-test
          MINDLEAK_UPGRADE_FROM: monkeemagic/mindleak-light@sha256:393e710d65d802d66a0e023945312c365f14a1f88b085871f14ee5e219d43735
      - name: Upgrade from published 0.3.0
        run: node scripts/container-smoke.mjs
        env:
          MINDLEAK_IMAGE: mindleak-light:all-in-one-test
          MINDLEAK_UPGRADE_FROM: monkeemagic/mindleak-light@sha256:a4d90454229a414c588a88ee5bf920973063fd34473ddc4b9548d8f751515cbf
      - name: Upgrade from pinned baseline and restore its backup
        shell: bash
        env:
          MINDLEAK_IMAGE: mindleak-light:all-in-one-test
        run: |
          export MINDLEAK_UPGRADE_FROM="$(node -p 'require("./scripts/regression-baseline.json").image')"
          mkdir -p target
          node scripts/container-smoke.mjs --restore 2>&1 | tee target/baseline-restore.log
      - name: Preserve backup restoration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-restore-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/baseline-restore.log
          retention-days: 30
          if-no-files-found: warn
